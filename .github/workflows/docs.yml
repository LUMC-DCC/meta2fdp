name: Build and deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/meta2fdp/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e .

      - name: Build documentation
        run: |
          rm -rf docs/build
          cd docs
          uv run sphinx-apidoc -o source/apidoc ../src/meta2fdp
          uv run sphinx-build -M html source build

      
