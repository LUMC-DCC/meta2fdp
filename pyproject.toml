[project]
name = "meta2fdp"
version = "0.1.0"
description = "Adapters between source systems and a FAIR Data Point for publishing metadata."
readme = "README.md"
authors = [
    { name = "Karolis Cremers", email = "k.m.p.cremers@lumc.nl" },
    { name = "Anna Niehues", email = "a.niehues@lumc.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "pandas>=3.0.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "requests>=2.32.5",
    "sempyro>=2.1.0",
    "pymssql==2.3.7"
]

[project.scripts]
meta2fdp = "meta2fdp:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
testpaths = [
    "tests",
]
addopts = [
    "-ra",
]
norecursedirs = ["__pycache__"]

[dependency-groups]
dev = [
    "myst-parser>=5.0.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.7.0",
    "sphinx-autodoc-typehints>=3.8.0",
    "sphinx-book-theme>=1.1.4",
    "sphinxcontrib-mermaid>=2.0.0",
]
