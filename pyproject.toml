[project]
name = "beat-covid-hri"
version = "0.1.0"
description = "Collection of scripts extends previous work of using JSON to populate a FDP to accept a excel sheet. This also includes an updated client which allows for updating resource descriptions through the api."
authors = [
    {name = "kmpcremers",email = "kmpcremers@lumc.nl"}
]
readme = "README.md"
package-mode = false
requires-python = "^3.12"
dependencies = [
    "rdflib (>=7.1.4,<8.0.0)",
    "pyparsing (>=3.2.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
