[project]
name = "meta2fdp"
version = "0.1.0"
description = "Adapters between source systems and a FAIR Data Point for publishing metadata."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Karolis Cremers"},
    {name = "Anna Niehues"}
]
dependencies = [
    "rdflib (>=7.1.4,<8.0.0)",
    "pyparsing (>=3.2.3,<4.0.0)"
]

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]